name: Populate average daytime highs (NASA POWER)
on:
  workflow_dispatch:
  schedule:
    - cron: '31 2,8,14,20 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/update_climate_highs.py'
permissions:
  contents: write
concurrency:
  group: wherenow-climate-highs
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch missing city highs serially and publish one batch
        env:
          CLIMATE_BATCH_SIZE: '100'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/update_climate_highs.py
          git add -- data.json climate-import-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh sourced city climate highs"
            git push || { echo "Push failed; stopping to avoid overwriting remote changes"; exit 1; }
          fi
