name: Populate average daytime highs (NASA POWER)
on:
  workflow_dispatch:
  schedule:
    - cron: '31 2,8,14,20 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/update_climate_highs.py'
permissions:
  contents: write
concurrency:
  group: wherenow-climate-highs
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Process missing cities one by one and commit each result
        env:
          CLIMATE_BATCH_SIZE: '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in $(seq 1 100); do
            remaining=$(python -c "import json; a=json.load(open('data.json')); print(sum(not(len(c.get('months',[]))==12 and all(isinstance(m.get('highC'),(int,float)) and -75<m['highC']<65 for m in c['months'])) for c in a))")
            echo "Iteration $i: $remaining destinations remaining"
            if [ "$remaining" -eq 0 ]; then break; fi
            python tools/update_climate_highs.py || true
            git add data.json climate-import-status.json
            if ! git diff --cached --quiet; then
              git commit -m "Climate: process next missing city ($i)"
              git push || { echo "Push failed; stopping to avoid overwriting remote changes"; exit 1; }
            fi
          done
